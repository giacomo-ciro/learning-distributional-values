defaults:
  - _self_
  - model: siglip_linear  # random, majority, resnet101_scratch, {resnet101,siglip}_{linear,ffnn}
  - debug: null

run_name: siglip_linear_ft
seed: 42
resume_from_ckpt: null  # e.g. debug/best.ckpt, null trains from scratch

data:
  root: data/20h_fullft_eval_success
  split:  # in episodes
    val: 100
    test: 100
  n_bins: 201
  eval_frame_stride: 10  # train uses all
  batch_size: 4
  num_workers: 16

trainer:
  lr: 3.0e-4
  max_steps: 1000
  val_every_n_steps: 100
  log_every_n_steps: 10
  precision: bf16-mixed
  accumulate_grad_batches: 16  # optimizer step every n batches; must be 1 for the gradient-free baselines
  overfit_train_batches: 0  # 0 disables
  limit_val_batches: 1  # int = n batches, float = fraction
  limit_test_batches: 1.0
  enable_checkpointing: true  # saves checkpoints/<run_name>/best.ckpt and config.yaml
  

hydra:
  run:
    dir: hydra_logs
