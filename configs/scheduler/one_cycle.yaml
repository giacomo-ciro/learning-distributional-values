_target_: torch.optim.lr_scheduler.OneCycleLR
_partial_: true  # the optimizer is passed in BaseModel.configure_optimizers
max_lr: ${trainer.lr}  # warms up from max_lr / div_factor, anneals to max_lr / (div_factor * final_div_factor)
total_steps: ${trainer.max_steps}  # stepped once per optimizer step
pct_start: 0.3
anneal_strategy: cos
div_factor: 25.0
final_div_factor: 1.0e+4
